[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "self-improving-ai"
version = "0.1.0"
description = "A production-grade Self-Improving AI System that continuously optimizes its own prompts, workflows, tools, reasoning strategies, and code."
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Self-Improving AI Team"}
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "redis>=5.0.0",
    "celery>=5.3.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "chromadb>=0.4.0",
    "openai>=1.12.0",
    "anthropic>=0.18.0",
    "httpx>=0.26.0",
    "prometheus-client>=0.19.0",
    "structlog>=24.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
    "cryptography>=42.0.0",
    "tenacity>=8.2.0",
    "cachetools>=5.3.0",
    "apscheduler>=3.10.0",
    "pandas>=2.1.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "httpx-mock>=0.11.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "locust>=2.20.0",
    "faker>=22.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=self_improving_ai --cov-report=term-missing"

[tool.setuptools.packages.find]
include = ["self_improving_ai*", "api*", "core*", "config*", "memory*", "deployment*", "experiments*", "benchmarks*", "observability*", "migrations*"]
